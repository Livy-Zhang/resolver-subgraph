specVersion: 1.3.0
indexerHints:
  prune: auto

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: DelegationManager
    network: sepolia
    source:
      address: "0x64E8E0051DA7991142911376865f9Ec1f5E33e4f"
      abi: DelegationManager
      startBlock: 11627441
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Resolver
        - Delegation
        - DelegatedEvent
        - UndelegatedEvent
        - RedelegatedEvent
        - FreezingPeriodUpdatedEvent
      abis:
        - name: DelegationManager
          file: ./abis/DelegationManager.json
      eventHandlers:
        - event: Delegated(indexed address,indexed address,uint256)
          handler: handleDelegated
        - event: Undelegated(indexed address,uint256)
          handler: handleUndelegated
        - event: Redelegated(indexed address,indexed address,indexed address)
          handler: handleRedelegated
        - event: FreezingPeriodUpdated(uint256)
          handler: handleFreezingPeriodUpdated
      file: ./src/delegation-manager.ts

  - kind: ethereum/contract
    name: StakingManager
    network: sepolia
    source:
      address: "0x46F173816ACA426ba1110517f45c6cbbbc38fDaa"
      abi: StakingManager
      startBlock: 11627430
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Resolver
        - OperatorAuthorization
        - StakedEvent
        - UnstakedEvent
        - StakedWithdrawnEvent
        - OperatorUpdatedEvent
        - MinSelfStakeUpdatedEvent
        - ThawingPeriodUpdatedEvent
      abis:
        - name: StakingManager
          file: ./abis/StakingManager.json
      eventHandlers:
        - event: Staked(indexed address,uint256)
          handler: handleStaked
        - event: Unstaked(indexed address,uint256)
          handler: handleUnstaked
        - event: StakedWithdrawn(indexed address,indexed address,uint256)
          handler: handleStakedWithdrawn
        - event: SetOperator(indexed address,indexed address,bool)
          handler: handleSetOperator
        - event: MinSelfStakeUpdated(uint256)
          handler: handleMinSelfStakeUpdated
        - event: ThawingPeriodUpdated(uint256)
          handler: handleThawingPeriodUpdated
      file: ./src/staking-manager.ts

  # Replace with the deployed Sepolia address and deployment block before publishing.
  - kind: ethereum/contract
    name: RewardsDistributorFactory
    network: sepolia
    source:
      address: "0x7A9CE1F71c8ca1D4A7fA350D5dA8fd629EFe1e00"
      abi: RewardsDistributorFactory
      startBlock: 11627443
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Resolver
        - RewardsDistributor
        - DistributorCreatedEvent
      abis:
        - name: RewardsDistributorFactory
          file: ./abis/RewardsDistributorFactory.json
        - name: RewardsDistributor
          file: ./abis/RewardsDistributor.json
      eventHandlers:
        - event: DistributorCreated(indexed address,indexed address,address,address,uint256)
          handler: handleDistributorCreated
      file: ./src/rewards-distributor-factory.ts

templates:
  - kind: ethereum/contract
    name: RewardsDistributor
    network: sepolia
    source:
      abi: RewardsDistributor
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RewardsDistributor
        - RewardRateUpdatedEvent
      abis:
        - name: RewardsDistributor
          file: ./abis/RewardsDistributor.json
      eventHandlers:
        - event: RewardRateUpdated(uint256,uint256)
          handler: handleRewardRateUpdated
      file: ./src/rewards-distributor.ts
